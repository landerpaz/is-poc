[project]
name = "a2a-application-agent-langgraph"
version = "0.1.0"
description = "Application management agent with A2A Protocol"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=1.0.2,<2.0.0",
    "starlette>=0.41.0",
    "httpx>=0.28.1",
    "langchain-google-genai>=2.0.10",
    "langgraph>=0.3.18",
    "pydantic>=2.10.6",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.34.2",
    "langchain-core",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
